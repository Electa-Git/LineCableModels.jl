FORMULAS = "the identifiers of the family's formulas, which the unknown-identifier error prints"

[register."Engine.InsulationAdmittance".formulas]
lossless = "κ = jωε₀εᵣ, conduction and polarization loss left out (commit 989af96c, insulationadmittance/formulas/lossless.jl)"
lossy = "κ = 1/ρ + ω ε₀ ε_r tan δ + j ω ε₀ ε_r: conduction, polarization loss and displacement current of a dielectric"

