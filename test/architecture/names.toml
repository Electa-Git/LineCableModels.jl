# The terms of the package's own names: modules, types, functions, constants, fields and
# keywords. A term enters with the user's confirmation, when the first name that uses it
# arrives, and leaves when no name uses it. [global] holds the grammar verbs, defined only in
# Commons, and the terms of several modules. [modules."<Module>"] holds the terms of one module
# and its children.
# [register."<Module>".public] and [register."<Module>".private] list every function, type and
# constant the module defines, each with its meaning. A name enters with the user's
# confirmation, in the step that introduces it, and leaves with its definition. In
# [register."<Module>"], the list lifts = ["<name>", ...] names the functions of the module
# that lift a value to a type with `Val`.

[shape]
function = 2
type = 3
module = 2
constant = 2
field = 2
keyword = 2
predicates = ["is", "has"]
marker = "abstract"
prepositions = ["in", "per", "to", "by", "of", "or", "for", "from", "with", "at", "on"]
mandated = ["__init__"]

[rejected]
check = "validate"
verify = "validate"
ensure = "validate"
require = "validate"
assert = "validate"
get = "the name of the quantity"
set = "the name of the quantity, with !"
make = "the constructor"
create = "the constructor"
calc = "the name of the quantity"
calculate = "the name of the quantity"
same = "==, isequal or isapprox"
valid = "isvalid"
match = "=="
matches = "=="
equal = "isequal"
data = "the name of what it holds"
info = "the name of what it holds"
helper = "a method of the function it serves"
util = "a method of the function it serves"
utils = "a method of the function it serves"
work = "workspace, plan, buffers or the component's name"
scratch = "workspace, plan, buffers or the component's name"
storage = "workspace, plan, buffers or the component's name"
cache = "workspace, plan, buffers or the component's name"

[global]
nouns = ["commons", "materials", "earth", "data_model", "material"]
qualifiers = []
symbols = ["rho", "eps_r", "mu_r"]

[global.verbs]
validate = "check an input before its consumer uses it; return it unchanged, or throw"
resolve = "give a declared part or layer its geometry in its context, or place a shape in a frame"
build = "construct a completed object of a type from its declarations"

[modules.Materials]
nouns = ["kind"]
symbols = ["t0", "alpha", "rho_thermal", "theta_max", "tan_delta", "sigma_solar"]

[modules.Earth]
nouns = ["layer", "layers", "model", "thickness"]
qualifiers = ["homogeneous"]

[modules.DataModel]
nouns = ["placement", "shape", "primitive", "circle", "annulus", "rectangle", "offset", "strip",
    "pattern", "helix", "lay", "ratio", "area", "centroid", "support", "boundary", "placements",
    "overlength", "pitch", "span", "distance", "holes", "part", "region", "stack", "terminal",
    "repeat", "enclosure", "design", "tag", "items", "name", "contents", "fill", "source",
    "regions", "id", "tree", "terminals", "assemblies", "repeats", "lays", "compactions",
    "fills", "system", "designs", "connections", "line_length", "blueprint", "conductor",
    "dielectric", "conductors", "dielectrics", "ranges", "assembly", "positions", "core",
    "insulation", "screen", "sheath", "bedding", "jacket", "armor", "center"]
qualifiers = ["bent", "circular", "empty", "difference", "placed", "cable", "outer",
    "stranded", "layout"]
symbols = ["x", "y", "φ", "r", "ri", "ro", "w", "h", "t", "n", "φ0", "gap_frac", "q", "dir",
    "r_in", "r_ex", "mu_r_ins"]
prepositions = ["at"]

[modules.DataModel.verbs]
flatten = "reduce a cable design to the equivalent tubes and dielectric layers of its blueprint"

[register.Commons.public]
validate = "check an input before its consumer uses it; return it unchanged, or throw"
resolve = "give a declared part or layer its geometry in its context, or place a shape in a frame"
build = "construct a completed object of a type from its declarations"

[register.Materials]
lifts = ["material"]

[register.Materials.public]
Material = "the electromagnetic and thermal properties of one material, its class the type parameter"
material = "the Material of a class with the properties given as keywords"

[register.Earth.public]
EarthLayer = "the static properties and thickness of one earth or air layer"
EarthModel = "an ordered stack of earth layers, semi-infinite air first"
homogeneous = "the earth model of air above one semi-infinite earth layer"

[register.DataModel.public]
Placement = "a planar translation and rotation relative to a parent frame"
AbstractShape = "the supertype of the exact cross-sections of cable parts"
AbstractPrimitive = "the supertype of the shapes a part declares, with dimensions and a placement"
Circle = "a circular cross-section with its placement"
Annulus = "an annular cross-section with its placement"
Rectangle = "a rectangular strand before a circular pattern bends it"
AbstractLayoutPattern = "the supertype of the patterns that place the copies of a repeat"
Offset = "a distance outward from the outline inside: the thickness of a layer or the clearance of a circular pattern"
BentStrip = "a rectangular strand bent onto its course, an annular sector of the same area"
CircularPattern = "n members placed evenly on a circle about the center of the enclosing part, at a radius or an offset"
Helix = "the helical path of the members of a course along the cable"
LayRatio = "the lay length of a helix over the mean diameter of its course"
area = "the cross-sectional area of a shape"
centroid = "the centroid of a shape in the cable cross-section"
support = "the radius of a circle about the origin that contains a shape"
boundary = "the outline of a shape that the next part resolves against"
r_in = "the inner radius of a circular shape"
r_ex = "the outer radius of a circular shape"
placements = "the placements and the shared cross-section of the members a pattern lays"
overlength = "the length of a helical path over the length of the cable"
pitch = "the lay length of a helix at a radius"
DifferenceShape = "a cross-section without the cross-sections inside it, such as the fill between wires"
distance = "the radius of a circle about the origin that a shape does not enter"
AbstractCablePart = "the supertype of the declared parts of a cable"
Region = "a part of one material in one cross-section"
Stack = "parts layered outward, each resolved against the outline of the parts inside it"
Terminal = "the name that identifies, within its scope, the circuit node of the conductive regions of a part"
Repeat = "copies of a part at the placements of a pattern, each copy a scope of its terminals"
Lay = "the helix that the copies of a repeat follow along the cable"
Enclosure = "a fill region whose cross-section is a container without the parts inside it"
PlacedRegion = "a declared region with its resolved cross-section"
CableDesign = "a cable described: its declared parts, its placed regions and the tables that map them"
CableSystem = "the cables of a line in one cross-section, placed, with the conductor index of each terminal"
CableBlueprint = "a cable described for coaxial formulations: equivalent tubes, their dielectric layers and assemblies"
BlueprintConductor = "one terminal of a cable as an equivalent tube and its material"
BlueprintDielectric = "one dielectric layer of the interval of an equivalent tube"
flatten = "the blueprint of a cable design"
"@cable" = "the cable design built from the parts of a block, from the inside out"
"@terminal" = "the terminal of a name around the parts of a block"
core = "a solid round conductor at the center of a cable"
insulation = "an insulation layer of a thickness around the part inside it"
screen = "a screen layer of a thickness around the part inside it"
sheath = "a sheath layer of a thickness around the part inside it"
bedding = "a bedding layer of a thickness around the part inside it"
jacket = "a jacket layer of a thickness around the part inside it"
stranded = "a stranded conductor: courses of round wires or rectangular strands around a center wire, inside an outline that a fill completes"
armor = "a course of round armor wires laid on the part inside it, in a fill as thick as the wires"

[register.DataModel.private]
EmptyBoundary = "the outline at the center of a cable, before its first part"
