# The terms of the package's own names: modules, types, functions, constants, fields and
# keywords. A term enters with the user's confirmation, when the first name that uses it
# arrives, and leaves when no name uses it. [global] holds the grammar verbs, defined only in
# Commons, and the terms of several modules. [modules."<Module>"] holds the terms of one module
# and its children.
# [register."<Module>".public] and [register."<Module>".private] list every function, type and
# constant the module defines, each with its meaning. A name enters with the user's
# confirmation, in the step that introduces it, and leaves with its definition. In
# [register."<Module>"], the list lifts = ["<name>", ...] names the functions of the module
# that lift a value to a type with `Val`.

[shape]
function = 2
type = 3
module = 2
constant = 2
field = 2
keyword = 2
predicates = ["is", "has"]
marker = "abstract"
prepositions = ["in", "per", "to", "by", "of", "or", "for", "from", "with", "at", "on"]
mandated = ["__init__"]

[rejected]
check = "validate"
verify = "validate"
ensure = "validate"
require = "validate"
assert = "validate"
get = "the name of the quantity"
set = "the name of the quantity, with !"
make = "the constructor"
create = "the constructor"
calc = "the name of the quantity"
calculate = "the name of the quantity"
same = "==, isequal or isapprox"
valid = "isvalid"
match = "=="
matches = "=="
equal = "isequal"
data = "the name of what it holds"
info = "the name of what it holds"
helper = "a method of the function it serves"
util = "a method of the function it serves"
utils = "a method of the function it serves"
work = "workspace, plan, buffers or the component's name"
scratch = "workspace, plan, buffers or the component's name"
storage = "workspace, plan, buffers or the component's name"
cache = "workspace, plan, buffers or the component's name"

[global]
nouns = ["commons", "materials", "earth", "data_model", "engine", "material", "formulation",
    "options", "backend", "insulation", "system", "line_length", "terminals", "assemblies",
    "layer", "layers"]
qualifiers = ["cable"]
symbols = ["rho", "eps_r", "mu_r", "y", "x", "r_in", "r_ex", "mu_r_ins"]

[global.verbs]
validate = "check an input before its consumer uses it; return it unchanged, or throw"
resolve = "give a declared part or layer its geometry in its context, or place a shape in a frame"
build = "construct a completed object of a type from its declarations"
compute = "run one computation of a problem by a formulation, on the backend that runs it"
select = "fit a user's selection to the slot or option key it fills, lifting a Symbol to its type"

[modules.Commons]
nouns = ["computation", "defaults", "values"]

[modules.Materials]
nouns = ["kind"]
symbols = ["t0", "alpha", "rho_thermal", "theta_max", "tan_delta", "sigma_solar"]

[modules.Earth]
nouns = ["model", "thickness"]
qualifiers = ["homogeneous"]

[modules.DataModel]
nouns = ["placement", "shape", "primitive", "circle", "annulus", "rectangle", "offset", "strip",
    "pattern", "helix", "lay", "ratio", "area", "centroid", "support", "boundary", "placements",
    "overlength", "pitch", "span", "distance", "holes", "part", "region", "stack", "terminal",
    "repeat", "enclosure", "design", "tag", "items", "name", "contents", "fill", "source",
    "regions", "id", "tree", "repeats", "lays", "compactions", "fills",
    "designs", "connections", "blueprint", "conductor", "dielectric", "conductors",
    "dielectrics", "ranges", "assembly", "positions", "core", "screen", "sheath", "bedding",
    "jacket", "armor", "center"]
qualifiers = ["bent", "circular", "empty", "difference", "placed", "outer", "stranded",
    "layout"]
symbols = ["φ", "r", "ri", "ro", "w", "h", "t", "n", "φ0", "gap_frac", "q", "dir"]
prepositions = ["at"]

[modules.DataModel.verbs]
flatten = "reduce a cable design to the equivalent tubes and dielectric layers of its blueprint"

[modules.Engine]
nouns = ["formula", "formulas", "impedance", "potential", "admittivity", "resistivity",
    "properties", "admittance", "semicon", "temperature", "permittivity", "permeability",
    "line_parameters", "problem", "gmsh", "fem", "return", "shunt", "buffers", "trace",
    "frequencies", "input", "connection", "label", "radius", "bundles",
    "transposition", "integral", "integrand", "points", "ray"]
qualifiers = ["vacuum", "coaxial", "internal", "kept", "eliminated", "spectral", "nominal", "lcm"]
symbols = ["z", "r_ins_ex"]

[modules.Engine.verbs]
prepare = "fill a formula's per-frequency state that its quantity methods read"
initialize = "build the arrays of a computation once, before its loop"
bundle = "merge each other conductor of a bundle into the first conductor of its index, in the rows and columns of a matrix"
eliminate = "remove the eliminated rows and columns of a matrix by the Kron elimination, the Schur complement of the kept ones"
integrate = "evaluate an integral by the method that its tag selects, with the controls of its section"
solve = "find the line parameters of a problem at each of its frequencies"

[modules."Engine.EarthReturn"]
symbols = ["i0m1"]

[register.Commons]
lifts = ["select"]

[register.Commons.public]
validate = "check an input before its consumer uses it; return it unchanged, or throw"
resolve = "give a declared part or layer its geometry in its context, or place a shape in a frame"
build = "construct a completed object of a type from its declarations"
compute = "run one computation of a problem by a formulation, on the backend that runs it"
select = "fit a user's selection to the slot or option key it fills, lifting a Symbol to its type"
defaults = "the option keys of an owner with their default values and types"
AbstractFormulation = "the supertype of the formulations and of the formula families"
AbstractBackend = "the supertype of the singletons that run a formulation"
FormulationOptions = "the options of a formula or a formulation, its owner the first type parameter"
ComputationOptions = "the options of a backend for one computation, its owner the first type parameter"

[register.Materials]
lifts = ["material"]

[register.Materials.public]
