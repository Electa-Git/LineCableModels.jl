    "repeat", "enclosure", "design", "tag", "items", "name", "contents", "fill", "source",
    "regions", "id", "tree", "repeats", "lays", "compactions", "fills",
    "designs", "connections", "blueprint", "conductor", "conductors",
    "dielectrics", "assembly", "members", "interior", "core", "screen", "sheath", "bedding",
    "jacket", "tape", "wires", "spacing", "trefoil", "apex", "fillet",
    "polygon", "ellipse", "vertices"]
