FORMULAS = "the identifiers of the family's formulas, which the unknown-identifier error prints"

[register."Engine.EarthReturn".private]
i0m1 = "I₀(z) − 1 without the cancellation of the difference; three call sites: the family's Λ, the per-cable I₀ − 1, the interface kernel"

