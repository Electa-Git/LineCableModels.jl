[register."Engine.InternalImpedance".formulas]
schelkunoff1934 = "the inner, outer and transfer surface impedances of a tubular conductor (Schelkunoff 1934; commit 989af96c, internalimpedance/formulas/schelkunoff1934.jl)"
wedepohl1973 = "the surface impedances of a thin tube and of a solid conductor by Wedepohl and Wilcox's closed forms in coth and csch (Wedepohl and Wilcox 1973)"

[register."Engine.InsulationImpedance".public]
