reductions = "the conductor indices that the bundle and Kron reductions of a system merge, keep and remove under the formulation's options, with the labels of its conductors and of the kept rows"

"solve!" = "a backend's loop over the problem's frequencies that fills Z and Y and, when traced, its stage matrices"

[register."Engine.InternalImpedance".public]
