wise1934 = "the impedance of overhead conductors by the correction integral of a homogeneous earth with its displacement current (Wise 1934, Proc. IRE 22(4), p. 526)"
wise1948 = "the potential coefficients of overhead conductors by the correction integral of a homogeneous earth (Wise 1948, Bell Syst. Tech. J. 27(2), eqs. 7, 8)"
xue2018 = "the complete field of Xue, Ametani, Mahseredjian and Kocar for buried pairs, with the prescribed Γ in place of the modal k_v and the voltage referred to infinite depth; at Γ = 0 the paper's quasi-TEM reduction (TPWRD 33(6), 2018)"

[register."Engine.Shunt".public]
Formula = "a shunt formula, its identifier the type parameter"
FORMULAS = "the identifiers of the family's formulas, which the unknown-identifier error prints"

[register."Engine.Shunt".formulas]
