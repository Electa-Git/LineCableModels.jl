CoaxialInput = "the numerical input of a computation in the coaxial model: each cable's equivalent tubular conductors and dielectric layers, the cables' centers and radii, and the reduction plan for the formulation's bundle and kron"
"bundle!" = "merge each other conductor of a bundle into the first conductor of its index, in the rows and columns of a matrix"
"eliminate!" = "the Kron elimination: the Schur complement of the kept rows and columns of a matrix, written into a matrix the caller gives"
"transposition!" = "the ideal transposition: the mean of a matrix over the cyclic permutations of its rows and columns"
SpectralIntegral = "the integral of a kernel in λ over [0, ∞) along the path ζ its constructor chooses, which integrate evaluates by the method its tag selects"
integrate = "evaluate an integral by the method that its tag selects, with the controls of its section"
