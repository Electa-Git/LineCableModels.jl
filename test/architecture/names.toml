[register.BaseGeometry.public]
Placement = "a planar translation and rotation relative to a parent frame"
Segment = "a straight curve from its point p to its point q in the cross-section plane"
Arc = "a circular curve of a radius about a placement, from its x-axis over a signed angular span"
EllipticArc = "an elliptic curve of two semi-axes along the axes of a placement, from a parametric angle over a signed parametric span, moved by its offset along its outward normal"
Curve = "a curve of a contour: a segment, an arc or an elliptic arc, their union written once"
Contour = "the closed paths of curves that bound a shape: its outer path and the path of each hole, each counterclockwise"
direction = "the direction of the tangent of a curve at a parameter; of an oriented curve stored in a geometry, its direction leaving its first point, measured at a distance along it, so that tangent arcs of different radii compare"
turn = "the turn of a curve: the turn of its tangent as a fraction of a revolution and its length, zero for a segment, the span over a revolution for an arc, the turn of its normal for an elliptic arc; of the parallel of a face at a signed distance between two points, the signed fraction and length of that piece, negative once the face has vanished"
parallel = "the parallel at a distance signed along the outward normal: of a curve, a segment moved along its normal, an arc of its radius plus the distance in its sense, an elliptic arc of its offset plus the distance; of the piece of a curve's parallel between two points; of the junction of two consecutive curves, the end of the first parallel and the start of the second, one point where they meet and each end moved along its own normal where they diverge; of a contour, curve for curve, trimmed at its junctions, with an arc about each corner where the parallels diverge"
vertex = "the vertex where two curves cross, nearest a point: the crossing of the lines or circles that carry them; where a line and a circle no longer meet, the foot of the circle's center on the line, and where two circles no longer meet, the point of their line of centers on their radical axis; refused for an elliptic arc. The one `parallel(a, b, d)` reads it with the two parallels and their junction"
clearance = "the clearance between two curves: their two nearest points, its width and the parameters of the two points on their curves, for two arcs of one center the difference of their radii less the distance of their centers, for two arcs of one ellipse the difference of their offsets; the middle of the common range when the two points are not unique"
overlap = "the widest common angular range of two arcs of one center or of one ellipse, an interval of the first arc's counterclockwise angle; empty when they share none, its endpoints then the two ends that bound the gap"
lowest = "the lowest point: of a segment its lower end; of an arc or an elliptic arc the bottom of the curve when the arc passes it, else its lower end; of a contour the lowest of its outer path's curves, least y then least x"
area = "the cross-sectional area of a shape, or the signed area of a closed polyline, positive counterclockwise"
centroid = "the centroid of a shape in the cable cross-section"
perimeter = "the length of the outline of a shape"
apsides = "the apsides of a curve about a point: the parameters of its point nearest to and of its point farthest from that point, its ends included"
winding = "the winding about a point: of a closed path its winding number, of a curve the signed fraction of a revolution that its direction from the point sweeps"
support = "the radius of a circle about the origin that contains a shape, or the support function of a shape in a direction: its largest projection on that direction"
distance = "the radius of a circle about the origin that a shape does not enter"
dimension = "the distance across the metal of a shape: twice the depth at which the inward parallel of its outline first degenerates; a circle's diameter, an annulus's thickness, a rectangle's smaller side; of a curve, the metal on its left, twice the depth at which its inward parallel degenerates: twice its smallest convex radius, infinite for a segment or a curve that turns away from its left"
draw = "draw a system, a design, a placed region, a shape, a contour or a path on a target as the curves the target draws, returning what the target made"

[register.LineCableModelsGmshExt.public]

[register.LineCableModelsGmshExt.private]
directory = "the run directory of a computation under .linecablemodels/fem"
mesh = "write the validated meshes of the cross-section at every frequency with Gmsh, each with its gauge tree, at most workers processes at once"
"gauge!" = "write the gauge tree and the sampling nodes into a mesh"
OVERRIDES = "the table of the native expert controls: each native name with its default and its range"
segments = "the segments per turn of the circle rule at a tolerance: the fewest of 12 times a power of 2 whose inscribed polygon bounds the relative error of a circle's area by the tolerance"
FieldModel = "the finite-element model of a problem under a formulation: the material groups and the region, terminal and cable data that the later steps read"
TAGS = "the tags of the physical groups that the native sources expect, by role"
Geometry = "the Gmsh geometry of one cross-section under construction, built once per computation and read by the writer"
key = "the registry key of a geometric entity: its defining numbers rounded to 15 significant digits, so that two constructions of one entity meet; of a coordinate pair, the registered pair within 64 eps of it, else its own key; of an angle on a circle, the circle's break within 1e-12 rad of it, else the angle in [0, 2π)"
"point!" = "the Gmsh point at a coordinate pair, created once"
"cut!" = "cut a circle at an angle, matched to its breaks within 1e-12 rad, keeping the exact contact point when given; with no angle, at its four quadrants; cut the circles of a contour or shape, a fill at its compartments, all circles at their contacts and concentric annuli at each other's breaks"
"faces!" = "the plane surfaces of a contour: one of its outer loop with its holes' clockwise loops when no two loops share a point, the walked faces when they do; a shape by its contour; a fill by its compartments and the free spans of its shell when it is a course of wires, else by its contour"
compartments = "the course of wires tangent to the inner circle of a fill: its center, the inner, contact and shell radii, the wires' angles and holes, and the free spans of the shell; with no wires when the fill is not such a course"
"walk!" = "walk oriented boundaries, each with its material on the left, into their cycles: the plane surfaces of the positive cycles with the negative cycles they contain, and the negative cycles no face contains"
isinside = "whether a point lies inside a closed polygon, by the even-odd rule"
"patches!" = "the four-sided patches of a passive annulus between its circles at their shared breaks, each with its arcs, spokes and corners, recorded for a region"
"strips!" = "the four-sided strips of a conducting region of kind 3, one per curve of each path of its contour, between the curve and its parallel at 0.45 of its dimension, each with the drawn pieces of its two sides, its spokes, corners and depth, recorded for the region, and the core inside the parallels; refused at a reflex corner"
anchor = "the measurement anchor of terminal t: the first probe point inside its metal, upward from the lowest point of each of its regions at the offsets of its dimension, for a shift of 0 and 1 % of the terminal's smallest dimension; refused when none is"
curves = "the boundary curves of plane surfaces, sorted"
scan = "scan the frequencies of a problem with GetDP: at most workers processes, one per frequency, from the meshes of the run directory, each process's job files read when it exits, results/Z.tsv and results/P.tsv written after the last, the primitive Z in Ω/m and P in Ω·m of every frequency returned by terminal"
section = "the native section of a shape or region: its kind, 1 a Circle or an Ellipse, 2 an Annulus or a layer, 3 a Rectangle, a Sector, a Polygon or an ArcPolygon, a PerforatedShape its outer's, with the two lengths the native size law reads, (r, 0), (ro, ri), (w, h), an ellipse's half dimension and 0, a sector's sides ro - ri and span (ro + ri) / 2, a polygon's or an arc polygon's `dimension`, twice; of a placed region, its declared primitive's, or, when the primitive is an Offset, its resolved shape's: a layer around another outline by its thickness `dimension` and 0, and a fill by its container's"

