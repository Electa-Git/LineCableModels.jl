# Ceiling: JET optimization reports per frequency-loop kernel, with
# `target_modules = (LineCableModels,)` on the default coaxial calculation of a
# three-phase cable system and on each modal formula. The three reports are the known
# boxing of earth-return records: the abstract `earth_calculations` tuple dispatches
# at the `_solve!` barrier and in the equivalent homogeneous earth below it, and
# `earth!` recurses over the record tuple.
[jet]
"cable_impedance!" = 0
"cable_potential!" = 0
"coaxial _solve!" = 2
"decompose! chrysochos2014" = 0
"decompose! vieira2026" = 0
"decompose! wedepohl1996" = 0
"earth!" = 1
"reduce_line_matrices!" = 0
