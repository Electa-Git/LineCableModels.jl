# Ceiling: JET optimization reports per frequency-loop kernel, with
# `target_modules = (LineCableModels,)` on the default coaxial computation of a
# three-phase cable system and on each modal formula. The current reports come from the
# known boxing of earth-return records. The abstract `earth_calculations` tuple dispatches
# at the `_solve!` barrier, and `earth!` recurses over the record tuple.
[jet]
"cable_impedance!" = 0
"cable_potential!" = 0
"coaxial _solve!" = 1
"decompose! chrysochos2014" = 0
"decompose! vieira2026" = 0
"decompose! wedepohl1996" = 0
"earth!" = 1
"reduce_line_matrices!" = 0

# Ceiling: allocations of the preservation corpus (`CurrentScenarios.preservation_corpus`),
# printed by `test/tools/allocations.jl`. `allocations` counts the allocated objects of one
# warmed-up `compute` call, which repeat exactly on every call. Measurements stores a
# partial derivative only when it is nonzero, and whether a round-off derivative is exactly
# zero depends on the machine. A count may differ from its row by the scenario's allowance,
# the uncertain real scalars of its result, which the tool computes and this table does not
# record. `bytes` is the minimum over three calls and may grow by 512 B plus the allowance
# times one derivative entry. Record a row's bytes again whenever its counts change.
