# Ceiling: JET optimization reports per frequency-loop kernel, with
# `target_modules = (LineCableModels,)` on the default coaxial calculation of a
# three-phase cable system and on each modal formula. The current reports come from the
# known boxing of earth-return records. The abstract `earth_calculations` tuple dispatches
# at the `_solve!` barrier and in the equivalent homogeneous earth below it, and `earth!`
# recurses over the record tuple.
[jet]
"cable_impedance!" = 0
"cable_potential!" = 0
"coaxial _solve!" = 2
"decompose! chrysochos2014" = 0
"decompose! vieira2026" = 0
"decompose! wedepohl1996" = 0
"earth!" = 1
"reduce_line_matrices!" = 0

# Ceiling: allocations of the preservation corpus (`CurrentScenarios.preservation_corpus`),
# printed by `test/tools/allocations.jl`. `allocations` counts the allocated objects of one
# warmed-up `compute` call, which repeat exactly on every call. A count may differ from its
# row by 0.01 % of it, rounded down, because last-bit floating-point differences between
# CPUs decide a few allocations of the large scenarios. `bytes` is the minimum over three
# calls and may grow by at most the larger of 512 B and 0.01 % before the check fails.
# Record a row's bytes again whenever its counts change.
[allocations]
"coaxial | 2 frequencies | allocations" = 7280
"coaxial | 2 frequencies | bytes" = 424624
