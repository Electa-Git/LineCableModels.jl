# Preservation locks, checked by `test/quality/preservation.jl`. Each table declares
# its direction: a floor may only rise and a ceiling may only fall, which
# `test/tools/baseline_ratchet.jl REF` checks across commits. The quality checks
# require the [inferred] and [jet] counts to equal the live counts. An [allocations] row
# fails only when its live count rises beyond its tolerance. The end of a track records
# again the rows that fell.

# The measured ceilings ([jet], [allocations]) hold for this Julia version and the
# committed `Manifest.toml` with this SHA-256 only. An increase in them is accepted only
# together with a change of this environment.
[environment]
julia = "1.12.7"
manifest = "273d4330a90e9df7e4bf560f4411a4dccc03a9631769f3de4fb902ee90c1a7cc"

[directions]
inferred = "floor"
jet = "ceiling"
allocations = "ceiling"

# Floor: `@inferred` uses per test file.
[inferred]
"test/extensions/measurements.jl" = 2
"test/integration/cable_constants.jl" = 3
