server_name: linecablemodels-playground-tls
port: 4222

jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 256MB
  max_file_store: 10GB
  key: $NATS_JETSTREAM_KEY
}

tls {
  cert_file: "/etc/nats/certs/server-cert.pem"
  key_file: "/etc/nats/certs/server-key.pem"
  ca_file: "/etc/nats/certs/ca.pem"
  verify: true
  timeout: 2
}

authorization {
  users: [
    {
      user: publisher
      password: $NATS_PUBLISHER_PASSWORD
      permissions: {
        publish: {
          allow: ["lcm.jobs.v1.>", "lcm.control.v1.cancel.>", "$JS.API.DIRECT.GET.LCM_RESULTS", "$JS.API.STREAM.MSG.GET.LCM_RESULTS", "$JS.API.STREAM.INFO.LCM_RESULTS"]
        }
        subscribe: {
          allow: ["lcm.results.v1.>", "lcm.events.v1.>", "lcm.workers.v1.>", "inbox.*"]
        }
      }
    }
    {
      user: worker
      password: $NATS_WORKER_PASSWORD
      permissions: {
        publish: {
          allow: ["lcm.results.v1.>", "lcm.events.v1.>", "lcm.workers.v1.>", "$JS.API.CONSUMER.>", "$JS.API.STREAM.INFO.LCM_RESULTS", "$JS.API.DIRECT.GET.LCM_RESULTS", "$JS.API.STREAM.MSG.GET.LCM_RESULTS", "$JS.ACK.>"]
        }
        subscribe: {
          allow: ["lcm.control.v1.cancel.>", "inbox.*"]
        }
      }
    }
    {
      user: administrator
      password: $NATS_ADMIN_PASSWORD
      permissions: {
        publish: ">"
        subscribe: ">"
      }
    }
  ]
}

http_port: 8222
