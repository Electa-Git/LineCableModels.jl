services:
  nats:
    image: docker.io/library/nats:2.11-alpine@sha256:e4bf19f15fd3218814a4e3c9e0064e1334bd8aa20d5984b9f1a0afd084f8cc00
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      NATS_PUBLISHER_PASSWORD: ${NATS_PUBLISHER_PASSWORD}
      NATS_WORKER_PASSWORD: ${NATS_WORKER_PASSWORD}
      NATS_ADMIN_PASSWORD: ${NATS_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${LCM_NATS_PORT:-4222}:4222"
      - "127.0.0.1:${LCM_NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro,z
      - nats-data:/data/jetstream
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 128
    mem_limit: ${LCM_NATS_MEMORY:-1g}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  runtime-init:
    build:
      context: ../..
      dockerfile: playground/deploy/publisher.Dockerfile
    command: ["lcm", "nats", "init"]
    environment:
      NATS_ADMIN_URL: nats://administrator:${NATS_ADMIN_PASSWORD}@nats:4222
    depends_on:
      - nats
    restart: on-failure
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: ${LCM_PUBLISHER_MEMORY:-2g}

  publisher:
    build:
      context: ../..
      dockerfile: playground/deploy/publisher.Dockerfile
    environment:
      NATS_CONNECT_URL: nats://publisher:${NATS_PUBLISHER_PASSWORD}@nats:4222
      LCM_ARTIFACT_ROOT: /var/lib/linecablemodels-artifacts
      HOST: 0.0.0.0
      PORT: 8080
    ports:
      - "127.0.0.1:${LCM_PUBLISHER_PORT:-8080}:8080"
    depends_on:
      - nats
    volumes:
      - artifact-data:/var/lib/linecablemodels-artifacts:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: ${LCM_PUBLISHER_MEMORY:-2g}

  worker:
    build:
      context: ../..
      dockerfile: playground/deploy/worker.Dockerfile
    environment:
      NATS_CONNECT_URL: nats://worker:${NATS_WORKER_PASSWORD}@nats:4222
      LCM_WORKER_DATA: /var/lib/linecablemodels-worker
      LCM_ARTIFACT_ROOT: /var/lib/linecablemodels-artifacts
      LCM_WORKER_ID: compose-worker
    volumes:
      - worker-data:/var/lib/linecablemodels-worker
      - artifact-data:/var/lib/linecablemodels-artifacts
    depends_on:
      nats:
        condition: service_started
      runtime-init:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: ${LCM_WORKER_MEMORY:-8g}

volumes:
  nats-data:
  worker-data:
  artifact-data:
