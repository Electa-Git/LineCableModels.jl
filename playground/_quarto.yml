project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - dev/*.qmd
    - templates/*.qmd
    - widgets/*.qmd
    - workbenches/*.qmd
    - presentations/*.qmd
  resources:
    - templates/components/**
    - XRAY.md
    - assets/application-catalogue.js
    - assets/published-frames.js

website:
  title: "LineCableModels playground"
  favicon: assets/logo.svg
  bread-crumbs: false
  page-navigation: false
  sidebar:
  - id: playground
    style: docked
    background: dark
    logo: assets/logo.svg
    title: "LineCableModels.jl"
    search: false
    contents:
      - section: "Playground"
        contents:
          - text: "Home"
            href: index.qmd
      - text: "Presentations"
        href: presentations/index.qmd
      - text: "Workbenches"
        href: workbenches/index.qmd
      - text: "Developer gallery"
        href: dev/index.qmd
  - id: developer
    style: docked
    background: dark
    logo: assets/logo.svg
    title: "LineCableModels.jl"
    search: false
    contents:
      - text: "Playground home"
        href: index.qmd
      - text: "Developer gallery"
        href: dev/index.qmd
      - section: "Templates"
        contents:
          - text: "Gallery"
            href: templates/index.qmd
          - text: "Full canvas"
            href: templates/full-canvas.qmd
          - text: "Balanced columns"
            href: templates/balanced-columns.qmd
          - text: "Feature + sidebar"
            href: templates/feature-sidebar.qmd
          - text: "Top band + columns"
            href: templates/top-split.qmd
          - text: "Dashboard grid"
            href: templates/dashboard-grid.qmd
          - text: "Media + narrative"
            href: templates/media-story.qmd
          - text: "Bonito viewport"
            href: templates/bonito-widget.qmd
          - text: "Collapsible sidebar"
            href: templates/collapsible-sidebar.qmd
      - section: "Widgets"
        contents:
          - text: "Gallery"
            href: widgets/index.qmd
      - section: "Workbench"
        contents:
          - text: "Foundation"
            href: dev/workbench.qmd
      - section: "Presentations"
        contents:
          - text: "Template gallery"
            href: dev/presentations.qmd
  page-footer:
    left: "LineCableModels playground"
    right: "Bonito · NATS · Quarto"

format:
  html:
    sidebar: playground
    theme:
      - darkly
      - assets/theme.scss
    css:
      - assets/brand.css
      - assets/control-contract.css
      - assets/published-text.css
      - assets/code-theme.css
      - assets/forms.css
      - assets/application-catalogue.css
    include-in-header: assets/theme-init.html
    include-after-body:
      - assets/theme-selector.html
      - assets/viewport-settle.html
      - assets/application-catalogue.html
      - assets/published-frames.html
    toc: false
    page-layout: full
    smooth-scroll: true
