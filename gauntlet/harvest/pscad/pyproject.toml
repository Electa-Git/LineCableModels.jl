[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linecablebenchmark"
version = "0.1.0"
description = "Harvest PSCAD Line Constants Program inputs and outputs as reproducible benchmark records"
requires-python = ">=3.10"
dependencies = [
  "mhi.pscad>=3.0.8",
  "mhi.xml>=1.4.0",
  "PyYAML>=6.0",
]

[project.scripts]
linecablebenchmark = "linecablebenchmark.cli:main"

[tool.setuptools.packages.find]
include = ["linecablebenchmark*"]
