schema_version = 1

[pscad]
version = "5.1.0"
compatibility_version = "5.0.2"
x64 = true
minimize = true
acquire_certificate = true
launch_timeout_seconds = 60
artifact_timeout_seconds = 1800
artifact_quiet_seconds = 2.0

[frequency_dependent_phase]
enabled = true
start_hz = 0.001
end_hz = 1.0e7
samples = 100
distribution = "LOG_LINEAR"
detailed_output = true
interpolate_travel_time = true
dc_correction = true
dc_correction_method = "FUNCTIONAL_FORM"

[frequency_dependent_phase.passivity]
mode = "SCAN_ONLY"
samples = 100
start_hz = 0.001
end_hz = 1.0e7

[axes.earth_resistivity]
enabled = true
values_ohm_m = [0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0]

[axes.earth_formulation]
enabled = true
aerial = "available"
underground = "available"
mixed = "available"

[axes.kron_reduction]
enabled = true
states = ["retained", "reduced"]

[output]
root = "runs"
keep_working_project = true

[batch]
root = "donors/original"
include = ["**/*.pscx"]
exclude = ["**/PSCAD463/**"]
resume = true
