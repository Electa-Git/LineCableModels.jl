coverage:
  precision: 2
  round: down
  range: "95...100"
  status:
    project:
      default:
        target: 95%
        threshold: 0%
        paths:
          - "src/"
          - "ext/"
    patch:
      default:
        target: 95%
        threshold: 0%
        paths:
          - "src/"
          - "ext/"

comment:
  layout: "reach,diff,flags,files"
  require_changes: true
