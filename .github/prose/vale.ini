StylesPath = styles
MinAlertLevel = suggestion
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip, https://github.com/Syntaf/vale-llm-slop/releases/download/v0.1.0/STE.zip

IgnoredScopes = code, tt
SkippedScopes = script, style, pre, svg
IgnoredClasses = math-container, docs-sidebar, docs-navbar, docs-footer, docs-right, docstring-binding, modal

[*]
TokenIgnores = (?<![`\w])(\$(?!\()[^$\n]+\$)(?!`)

BasedOnStyles = ai-tells, STE, Project
# A rule that a line below switches off is not removed. It runs as the rule of the same name under
# styles/Project, the original with the changes of the project (ai-tells.SemicolonUsage as Project.Semicolons).
ai-tells.SemicolonUsage = NO
ai-tells.EmphaticCopula = NO
ai-tells.Metacommentary = NO
ai-tells.RhetoricalSelfAnswer = NO
ai-tells.FigurativeNouns = NO
ai-tells.ColonUsage = NO
ai-tells.NounString = NO
ai-tells.OverusedVocabulary = NO
ai-tells.FillerIntensifier = NO
ai-tells.MotionMetaphors = NO
ai-tells.FigurativeShape = NO
ai-tells.EmDashUsage = NO
ai-tells.FormalRegister = NO
STE.Ambiguity = NO
STE.Contractions = NO
STE.Dictionary = NO
STE.Modals = warning
STE.NounClusters = NO
STE.SentenceLength = NO
STE.ProcedureLength = NO

[*.jl]
View = Julia
# Treat the first indented signature as code despite the captured string delimiter.
BlockIgnores = (?m)\A(?:raw)?"""[ \t]*\n((?:[ \t]+[\p{L}_][\w.!]*\([^\n]*\)\n)+)
# A list item of a docstring describes an argument or a field. It is not a step of a procedure, so the cap of
# 20 words on a list item does not apply. The cap of 25 words on a sentence, Project.SentenceLength, applies.
Project.ProcedureLength = NO

# A page of the build shows docstrings and the text of a Markdown file. The docstrings are exempt as in the
# source. The cap applies to each list item of the text in its Markdown file.
[*.html]
Project.ProcedureLength = NO

[*.{json,toml}]
View = Descriptions

[*.{yml,yaml}]
View = Workflow

[*.pro]
View = GetDP

[.gitignore]
View = HashComments

[*.sh]
View = HashComments

# Parse comments as Markdown as well as the descriptive values above.
[*.{yml,yaml,toml,js,css}]
View = Comments
