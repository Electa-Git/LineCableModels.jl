extends: ai-tells.Metacommentary
# Retain the parent's bold callout checks after limiting it to parsed prose.
scope: strong
tokens:
  - '^(?:Key insight|Key takeaway|Key point|Important|Note|Bottom line|The point):?$'
tests:
  - name: bold callout
    input: "**Key insight:** Use this value."
    contains: Project.EmphaticCallouts
  - name: ordinary text
    input: "Note the units."
    want: ""
