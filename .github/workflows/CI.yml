name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  core:
    name: Core / Julia ${{ matrix.julia }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        julia: ["1.12", "pre"]
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v3
        with:
          cache-compiled: ${{ matrix.julia != 'pre' }}
          save-always: "false"
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.julia == '1.12'
      - uses: codecov/codecov-action@v7
        if: matrix.julia == '1.12'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  plotting:
    name: CairoMakie extension
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LINECABLEMODELS_TEST_PLOTTING: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - uses: julia-actions/cache@v3
      - name: Run plotting extension tests
        shell: julia --startup-file=no --color=yes {0}
        run: |
          using Pkg
          Pkg.activate(; temp = true)
          Pkg.develop(PackageSpec(path = pwd()))
          Pkg.add(PackageSpec(name = "Aqua", version = "0.8"))
          Pkg.add(PackageSpec(name = "CairoMakie", version = "0.15"))
          Pkg.add(PackageSpec(name = "TestItemRunner", version = "1"))
          pushfirst!(LOAD_PATH, pwd())
          include(joinpath(pwd(), "test", "runtests.jl"))

  aqua:
    name: Aqua
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - uses: julia-actions/cache@v3
      - name: Run Aqua independently
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate(; temp = true)
          Pkg.develop(PackageSpec(path = pwd()))
          Pkg.add("Aqua")
          using Aqua, LineCableModels
          Aqua.test_all(LineCableModels)

  formatting:
    name: SciML formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - name: Check JuliaFormatter
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate(; temp = true)
          Pkg.add(PackageSpec(name = "JuliaFormatter", version = "2"))
          using JuliaFormatter
          @assert format(pwd(); overwrite = false, verbose = true)

  gitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gitlint
        run: python -m pip install --disable-pip-version-check gitlint==0.19.1
      - name: Check new commits
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            range="origin/${BASE_REF}..HEAD"
          elif [[ -n "${BEFORE_SHA}" && ! "${BEFORE_SHA}" =~ ^0+$ ]]; then
            range="${BEFORE_SHA}..${CURRENT_SHA}"
          else
            range="${CURRENT_SHA}^..${CURRENT_SHA}"
          fi
          gitlint --commits "${range}"

  clean-install:
    name: Clean installation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - name: Install core into an empty depot
        shell: bash
        run: |
          set -euo pipefail
          export JULIA_DEPOT_PATH
          JULIA_DEPOT_PATH="$(mktemp -d)"
          julia --startup-file=no --color=yes -e '
            using Pkg
            using TOML
            package_dependencies = TOML.parsefile(joinpath(pwd(), "Project.toml"))["deps"]
            @assert !haskey(package_dependencies, "Pluto")
            @assert !haskey(package_dependencies, "PlutoUI")
            Pkg.activate(; temp = true)
            Pkg.develop(PackageSpec(path = pwd()))
            using LineCableModels
            @assert Base.get_extension(LineCableModels, :LineCableModelsMakieExt) === nothing
            @assert Base.get_extension(LineCableModels, :LineCableModelsGmshExt) === nothing
          '

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - uses: julia-actions/cache@v3
        with:
          cache-compiled: "false"
          save-always: "false"
      - name: Instantiate documentation
        run: julia --project=docs --color=yes docs/instantiate.jl
      - name: Run doctests
        run: julia --project=docs --color=yes docs/doctest.jl
      - name: Build documentation
        run: julia --project=docs --color=yes docs/make.jl
      - name: Deploy documentation
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs --color=yes docs/deploy.jl
