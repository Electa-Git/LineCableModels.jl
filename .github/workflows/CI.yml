name: CI
on:
  push:
    branches:
      - main
      - release/v0.1.0
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message, 'skip ci') }}
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # The Julia cache step deletes the old caches that it created.
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
        with:
          cache-compiled: true
          # Do not publish incomplete depots from failed test runs.
          save-always: 'false'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.os }}
          fail_ci_if_error: true
  install:
    name: Install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - name: Install into an empty depot, without and with the extensions
        shell: bash
        run: |
          set -euo pipefail
          export JULIA_DEPOT_PATH
          JULIA_DEPOT_PATH="$(mktemp -d)"
          julia --startup-file=no --color=yes -e '
            using Pkg
            Pkg.activate(; temp = true)
            Pkg.add(PackageSpec(path = pwd()))
            using LineCableModels
            @assert Base.get_extension(LineCableModels, :LineCableModelsGmshExt) === nothing
            @assert Base.get_extension(LineCableModels, :LineCableModelsMeasurementsExt) === nothing
            Pkg.add("Measurements")
            using Measurements
            @assert Base.get_extension(LineCableModels, :LineCableModelsMeasurementsExt) !== nothing
            @assert Base.get_extension(LineCableModels, :LineCableModelsGmshExt) === nothing
            Pkg.add("Gmsh")
            using Gmsh
            @assert Base.get_extension(LineCableModels, :LineCableModelsGmshExt) !== nothing
          '
  prose:
    name: Writing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: # The deployment pushes the site and reports its status.
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
        with:
          cache-compiled: 'false'
          save-always: 'false'
          delete-old-caches: 'false'
      - name: Instantiate documentation
        run: julia --project=docs --color=yes -e 'using Pkg; Pkg.instantiate()'
      - name: Generate package-server usage map
        run: julia --project=docs --color=yes docs/package_stats.jl
      - name: Upload package-server usage map
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-server-usage-map
          path: docs/src/assets/user-statistics.svg
      - name: Build documentation
        id: docs_build
        run: julia --project=docs --color=yes docs/make.jl
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install writing tools
        id: prose_tools
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/prose-tools"
          mkdir -p "$tools" "$RUNNER_TEMP/prose-reports"
          release=https://github.com/vale-cli/vale/releases/download/v3.23.0
          curl --fail --location --retry 3 "$release/vale_3.23.0_Linux_64-bit.tar.gz" -o "$tools/vale.tar.gz"
          curl --fail --location --retry 3 "$release/vale_3.23.0_checksums.txt" -o "$tools/checksums.txt"
          expected=$(awk '$2 == "vale_3.23.0_Linux_64-bit.tar.gz" {print $1}' "$tools/checksums.txt")
          test -n "$expected"
          echo "$expected  $tools/vale.tar.gz" | sha256sum --check
          tar -xzf "$tools/vale.tar.gz" -C "$tools"
          cp .github/prose/package{,-lock}.json "$tools/"
          npm ci --prefix "$tools"
          echo "$tools" >> "$GITHUB_PATH"
          echo "$tools/node_modules/.bin" >> "$GITHUB_PATH"
          "$tools/vale" sync --no-global --config=.github/prose/vale.ini
      - name: Select all maintained writing
        id: prose_inputs
        run: bash .github/prose/files.sh "$RUNNER_TEMP/prose-reports"
      - name: Verify writing rules and exclusions
        shell: bash
        run: |
          set -euo pipefail
          vale test --no-global --config=.github/prose/vale.ini --coverage .github/prose/styles/Project .github/prose/fixtures | tee "$RUNNER_TEMP/prose-reports/rules.log"
          bash .github/prose/fixtures/check.sh | tee "$RUNNER_TEMP/prose-reports/checks.log"
      - name: Check prose with Vale
        if: ${{ !cancelled() && steps.prose_tools.outcome == 'success' && steps.prose_inputs.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < "$RUNNER_TEMP/prose-reports/vale-files.txt"
          vale --no-global --config=.github/prose/vale.ini --no-color "${files[@]}" 2>&1 | tee "$RUNNER_TEMP/prose-reports/vale.log"
      - name: Check spelling with cspell
        if: ${{ !cancelled() && steps.prose_tools.outcome == 'success' && steps.prose_inputs.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < "$RUNNER_TEMP/prose-reports/cspell-files.txt"
          cspell lint --config=.github/prose/cspell.json --no-progress --no-cache "${files[@]}" 2>&1 | tee "$RUNNER_TEMP/prose-reports/cspell.log"
      - name: Retain writing reports
        if: ${{ !cancelled() && steps.docs_build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: writing-reports
          path: ${{ runner.temp }}/prose-reports
          if-no-files-found: error
      - name: Deploy documentation
        if: ${{ success() && github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs --color=yes docs/deploy.jl
