name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

env:
  JULIA_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  core:
    name: Ordinary contracts / Julia ${{ matrix.julia }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        julia: ["1.12", "pre"]
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v3
        with:
          cache-compiled: ${{ matrix.julia != 'pre' }}
          save-always: "false"
          delete-old-caches: "false"
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  fem-numerical:
    name: Native FEM execution and contracts / GetDP 3.5.0
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DISPLAY: ""
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: "false"
      - name: Run FEM execution contracts (headless)
        run: |
          julia --project=test --startup-file=no --compiled-modules=no --code-coverage=@. --color=yes -e 'using Pkg; Pkg.instantiate()'
          julia --project=test --startup-file=no --compiled-modules=no --code-coverage=@. --color=yes -e '
            push!(ARGS, "tag:fem_numerical")
            include("test/runtests.jl")
          '
      - name: Name FEM coverage traces independently of runner process IDs
        if: ${{ !cancelled() }}
        shell: julia --startup-file=no {0}
        run: |
          for directory in ("src", "ext")
            for (root, _, files) in walkdir(directory), file in files
              endswith(file, ".cov") || continue
              mv(joinpath(root, file), joinpath(root, replace(file, r"\.cov$" => ".fem.cov")))
            end
          end
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: fem-production-coverage
          path: |
            src/**/*.fem.cov
            ext/**/*.fem.cov
          if-no-files-found: error
      - name: Remove coverage traces after workers and uploads finish
        if: always()
        run: julia --startup-file=no test/coverage.jl traces

  quality:
    name: Quality contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: "false"
      - name: Enforce package and architecture contracts
        run: |
          julia --project=test --color=yes -e 'using Pkg; Pkg.instantiate()'
          julia --project=test --color=yes -e '
            push!(ARGS, "tag:quality")
            include("test/runtests.jl")
          '

  coverage:
    name: Merged production coverage
    needs: [fem-numerical]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LINECABLEMODELS_TEST_PLOTTING: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: "false"
      - name: Instantiate coverage tools
        run: julia --project=test/coverage --color=yes -e 'using Pkg; Pkg.instantiate()'
      - name: Remove stale coverage traces
        run: julia --project=test/coverage --color=yes test/coverage.jl clean
      - name: Collect core and non-graphical extension coverage
        run: julia --project=. --color=yes -e 'using Pkg; Pkg.test(coverage = true)'
      - name: Collect core-only boundary coverage
        if: ${{ !cancelled() }}
        run: |
          julia --project=test/core --code-coverage=@. --color=yes -e 'using Pkg; Pkg.instantiate()'
          julia --project=test/core --code-coverage=@. --color=yes -e '
            push!(ARGS, "tag:core_only")
            include("test/runtests.jl")
          '
      - name: Collect Cairo and visual coverage
        if: ${{ !cancelled() }}
        run: |
          julia --project=test/visual --compiled-modules=no --code-coverage=@. --color=yes -e 'using Pkg; Pkg.instantiate()'
          julia --project=test/visual --compiled-modules=no --code-coverage=@. --color=yes -e '
            push!(ARGS, "tag:visual")
            include("test/runtests.jl")
          '
      - name: Collect Cairo activation boundary coverage
        if: ${{ !cancelled() }}
        run: julia --project=test/visual --code-coverage=@. test/runtests.jl "loaded extension activation"
      - name: Collect GLMakie boundary coverage
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth libgl1-mesa-dri
          xvfb-run -a julia --startup-file=no --code-coverage=@. --color=yes -e '
            using Pkg
            Pkg.activate(; temp = true)
            Pkg.develop(PackageSpec(path = pwd()))
            Pkg.add(PackageSpec(name = "GLMakie", version = "0.13"))
            Pkg.add(PackageSpec(name = "TestItemRunner", version = "1"))
            push!(ARGS, "loaded extension activation")
            include(joinpath(pwd(), "test", "runtests.jl"))
          '
      - name: Collect native FEM UI lifecycle coverage
        if: ${{ !cancelled() }}
        run: xvfb-run -a julia --project=test --code-coverage=@. test/runtests.jl extensions/fem_ui.jl
      - name: Collect WGLMakie boundary coverage
        if: ${{ !cancelled() }}
        run: |
          julia --project=. --code-coverage=@. --color=yes -e '
            using Pkg
            Pkg.activate(; temp = true)
            Pkg.develop(PackageSpec(path = pwd()))
            Pkg.add(PackageSpec(name = "WGLMakie", version = "0.13"))
            Pkg.add(PackageSpec(name = "TestItemRunner", version = "1"))
            push!(ARGS, "loaded extension activation")
            include(joinpath(pwd(), "test", "runtests.jl"))
          '
      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: fem-production-coverage
          path: .
      - name: Enforce source-amended 95% coverage
        if: ${{ !cancelled() }}
        run: julia --project=test/coverage --color=yes test/coverage.jl check
      - name: Retain the coverage report, including failed checks
        if: always() && hashFiles('lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: production-coverage-report
          path: lcov.info
          if-no-files-found: error
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Remove coverage traces after workers and uploads finish
        if: always()
        run: julia --startup-file=no test/coverage.jl traces

  aqua:
    name: Aqua
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: "false"
      - name: Run Aqua independently
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate(; temp = true)
          Pkg.develop(PackageSpec(path = pwd()))
          Pkg.add(["Aqua", "TestItemRunner"])
          push!(ARGS, "tag:aqua")
          include(joinpath(pwd(), "test", "runtests.jl"))

  clean-install:
    name: Clean installation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - name: Install core into an empty depot
        shell: bash
        run: |
          set -euo pipefail
          export JULIA_DEPOT_PATH
          JULIA_DEPOT_PATH="$(mktemp -d)"
          julia --startup-file=no --color=yes -e '
            using Pkg
            using TOML
            package_dependencies = TOML.parsefile(joinpath(pwd(), "Project.toml"))["deps"]
            @assert !haskey(package_dependencies, "Pluto")
            @assert !haskey(package_dependencies, "PlutoUI")
            @assert !haskey(package_dependencies, "CairoMakie")
            Pkg.activate(; temp = true)
            Pkg.develop(PackageSpec(path = pwd()))
            using LineCableModels
            @assert Base.get_extension(LineCableModels, :LineCableModelsMakieExt) === nothing
            @assert !any(info -> info.name == "CairoMakie", values(Pkg.dependencies()))
          '

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - uses: julia-actions/cache@v3
        with:
          cache-compiled: "false"
          save-always: "false"
          delete-old-caches: "false"
      - name: Instantiate documentation
        run: julia --project=docs --color=yes docs/instantiate.jl
      - name: Generate package-server usage map
        run: julia --project=docs --color=yes docs/package_stats.jl
      - name: Upload package-server usage map
        uses: actions/upload-artifact@v4
        with:
          name: package-server-usage-map
          path: docs/src/assets/user-statistics.svg
      - name: Run doctests
        run: julia --project=docs --color=yes docs/doctest.jl
      - name: Build documentation
        run: julia --project=docs --color=yes docs/make.jl
      - name: Deploy documentation
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs --color=yes docs/deploy.jl
